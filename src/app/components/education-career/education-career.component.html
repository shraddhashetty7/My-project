<div class="education-career-container">
  <h2>Education & Career Details</h2>

  <div class="content-wrapper">

    <!-- Left Image -->
    <div class="image-section">
      <img src="assets/education-career.jpg" alt="Education & Career" />
    </div>

    <!-- Right Form -->
    <div class="form-section">
      <form #careerForm="ngForm" (ngSubmit)="saveAndContinue()">

        <!-- ===================== -->
        <!-- 💼 CAREER DETAILS -->
        <!-- ===================== -->
        <h3>Career Details</h3>

        <!-- Designation -->
        <label>Designation</label>
        <input
          type="text"
          name="designation"
          [(ngModel)]="model.designation"
          placeholder="Eg: Software Engineer"
        />

        <!-- Organization -->
        <label>Organization</label>
        <input
          type="text"
          name="organization"
          [(ngModel)]="model.organization"
          placeholder="Eg: Infosys"
        />

        <!-- Total Experience -->
        <label>Total Experience (Years)</label>
        <input
          type="number"
          name="totalExperience"
          [(ngModel)]="model.totalExperience"
          min="0"
          placeholder="Eg: 7"
        />

        <!-- Relevant Experience -->
        <label>Relevant Experience (Years)</label>
        <input
          type="number"
          name="relevantExperience"
          [(ngModel)]="model.relevantExperience"
          min="0"
          placeholder="Eg: 5"
        />

        <!-- Annual Income -->
        <label>Annual Income</label>
        <input
          type="number"
          name="annualIncome"
          [(ngModel)]="model.annualIncome"
          min="0"
          placeholder="Eg: 1200000"
        />

        <!-- Job Location -->
        <label>Job Location</label>
        <input
          type="text"
          name="jobLocation"
          [(ngModel)]="model.jobLocation"
          placeholder="Eg: Bangalore"
        />

        <!-- ===================== -->
        <!-- 🎓 EDUCATION DETAILS -->
        <!-- ===================== -->
        <h3>Education Details</h3>

        <label>Education Level</label>
        <input
          type="text"
          name="educationLevel"
          [(ngModel)]="model.educationLevel"
          placeholder="Eg: B.E / MBA / M.Sc"
        />

        <label>Education Details</label>
        <input
          type="text"
          name="educationDetails"
          [(ngModel)]="model.educationDetails"
          placeholder="Eg: Electronics & Communication"
        />

        <!-- ===================== -->
        <!-- 🏢 BUSINESS DETAILS -->
        <!-- ===================== -->
        <h3>Business Details (Optional)</h3>

        <label>Business Name</label>
        <input
          type="text"
          name="businessName"
          [(ngModel)]="model.businessName"
          placeholder="Eg: ABC Enterprises"
        />

        <label>Business Type</label>
        <input
          type="text"
          name="businessType"
          [(ngModel)]="model.businessType"
          placeholder="Eg: IT / Retail"
        />

        <label>Key Designation</label>
        <input
          type="text"
          name="keyDesignation"
          [(ngModel)]="model.keyDesignation"
          placeholder="Eg: Owner / Partner"
        />

        <!-- ===================== -->
        <!-- BUTTONS -->
        <!-- ===================== -->
        <div class="buttons">
          <button type="button" class="back-btn" (click)="goBack()">
            ⬅️ Back
          </button>

          <button
            type="submit"
            class="submit-btn"
            [disabled]="careerForm.invalid">
            Save & Continue ➡️
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
