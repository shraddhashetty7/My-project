<div class="register-container">
  <div class="register-wrapper">
    <!-- 📝 Left Side – Form Section -->
    <div class="register-form">
      <h2>Register Your Profile</h2>

      <form #registerForm="ngForm" (ngSubmit)="goToEducationCareer(registerForm)" novalidate>

        <!-- Full Name -->
<label>Full Name</label>
<input
  type="text"
  name="fullName"
  [(ngModel)]="model.fullName"
  #fullName="ngModel"
  required
  placeholder="Enter your full name"
/>

<div
  *ngIf="fullName.invalid && (fullName.touched || registerForm.submitted)"
  class="error"
>
  Full name is required
</div>

       <!-- Email -->
<label>Email</label>
<input
  type="email"
  name="email"
  [(ngModel)]="model.email"
  #email="ngModel"
  required
  email
  placeholder="Enter your email address"
/>

<div
  *ngIf="email.invalid && (email.touched || registerForm.submitted)"
  class="error"
>
  A valid email is required
</div>

        <!-- Phone -->
<label>Phone Number</label>
<input
  type="tel"
  name="phone"
  [(ngModel)]="model.phone"
  #phone="ngModel"
  required
  pattern="^[0-9]{10}$"
  placeholder="Enter your phone number"
/>

<div
  *ngIf="phone.invalid && (phone.touched || registerForm.submitted)"
  class="error"
>
  Please enter a valid 10-digit phone number
</div>

       <!-- Work Location -->
<label>Work Location</label>
<input
  type="text"
  name="workLocation"
  [(ngModel)]="model.workLocation"
  #workLocation="ngModel"
  required
  placeholder="Enter your work location"
/>

<div
  *ngIf="workLocation.invalid && (workLocation.touched || registerForm.submitted)"
  class="error"
>
  Work location is required
</div>

       <!-- Gender -->
<label>Gender</label>
<div class="gender-options">
  <label>
    <input
      type="radio"
      name="gender"
      [(ngModel)]="model.gender"
      value="Male"
      required
    /> Male
  </label>

  <label>
    <input
      type="radio"
      name="gender"
      [(ngModel)]="model.gender"
      value="Female"
      required
    /> Female
  </label>
</div>

<div
  *ngIf="registerForm.submitted && !model.gender"
  class="error"
>
  Please select a gender
</div>

        <!-- 🪶 Caste Section -->
        <label>Caste</label>
        <div class="caste-options">
          <label>
            <input
              type="radio"
              name="caste"
              [(ngModel)]="model.caste"
              value="Shetty"
              (change)="onCasteChange('Shetty')"
              required
            /> Shetty
          </label>

          <label>
            <input
              type="radio"
              name="caste"
              [(ngModel)]="model.caste"
              value="Billava"
              (change)="onCasteChange('Billava')"
              required
            /> Billava
          </label>

          <label>
            <input
              type="radio"
              name="caste"
              [(ngModel)]="model.caste"
              value="Other"
              (change)="onCasteChange('Other')"
              required
            /> Other
          </label>
        </div>

        <!-- Show input if 'Other' is selected -->
        <div *ngIf="isOtherCasteSelected" class="other-caste">
          <label>Please mention your caste</label>
          <input
            type="text"
            name="otherCaste"
            [(ngModel)]="model.otherCaste"
            #otherCaste="ngModel"
            required
            placeholder="Enter caste name"
          />
          <div
            *ngIf="otherCaste.invalid && (otherCaste.touched || registerForm.submitted)"
            class="error"
          >
            Please mention your caste
          </div>
        </div>

        <!-- Validation if no caste is selected -->
        <div
          *ngIf="registerForm.submitted && !model.caste"
          class="error"
        >
          Please select your caste
        </div>

        <!-- Buttons -->
        <div class="button-group">
          <button type="button" class="back-btn" (click)="goBack()">⬅️ Back</button>
          <button type="submit" class="submit-btn">Register ➡️</button>
        </div>
      </form>
    </div>

    <!-- 📸 Right Side – Image Section -->
    <div class="image-section">
      <img src="assets/register.jpg" alt="Register Illustration" />
    </div>
  </div>
</div>
