<div class="verify-container">

  <!-- ========================= -->
  <!-- Aadhaar Verification -->
  <!-- ========================= -->
  <div class="verify-section">
    <div class="card">

      <!-- LEFT -->
      <div class="card-left">
        <img src="assets/idcard.jpg" alt="Verification" />
        <p class="trusted">
          IDENTITY VERIFICATION
          <small>Secure & Confidential</small>
        </p>
      </div>

      <!-- RIGHT -->
      <div class="card-right">

        <h2>Verify Your Profile</h2>
        <p class="note">
          Enter details exactly as per your Aadhaar card.
        </p>

        <!-- Aadhaar Number -->
        <input
          type="text"
          class="input-box"
          placeholder="Aadhaar Number (12 digits)"
          maxlength="12"
          [(ngModel)]="aadhaarNumber"
        />

        <!-- Aadhaar Linked Mobile -->
        <input
          type="text"
          class="input-box"
          placeholder="Mobile number linked with Aadhaar"
          maxlength="10"
          [(ngModel)]="aadhaarMobile"
        />

        <!-- Full Name -->
        <input
          type="text"
          class="input-box"
          placeholder="Full name as per Aadhaar"
          [(ngModel)]="fullName"
        />

        <!-- Declaration -->
        <label class="declaration">
          <input
            type="checkbox"
            [(ngModel)]="declarationAccepted"
          />
          I confirm that the above details belong to me and match my Aadhaar
          record.
        </label>

        <button
          class="btn primary-btn"
          (click)="submitVerification()"
        >
          Submit for Verification
        </button>

        <!-- Status -->
        <p *ngIf="submitted" class="success">
          ✅ Details submitted for verification
        </p>

        <p class="note">
          🔒 Your Aadhaar details are encrypted and not stored permanently.
        </p>

        <p class="note">
          ⏱ Verification usually takes up to 24 hours.
        </p>

      </div>
    </div>
  </div>

  <!-- ========================= -->
  <!-- Navigation -->
  <!-- ========================= -->
  <!-- Buttons -->
<div class="button-row">
    <button (click)="goBack()" class="back-btn">⬅️ Back</button>
    <button
  type="button"
  class="submit-btn"
  (click)="submitVerification()"
>
  Save & Continue ➡️
</button>

     <button (click)="skipAndContinue()" class="skip-btn">Skip & Continue ➡️</button>
</div>

</div>
